services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ml_exam
      POSTGRES_USER: ml_exam_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 환경변수를 설정해야 합니다}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - autovacuum_max_workers=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_exam_app -d ml_exam"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://ml_exam_app:${POSTGRES_PASSWORD}@db:5432/ml_exam
      IMAGE_STORAGE_PATH: /app/uploads
    command: >-
      sh -c "alembic upgrade head && python -m app.image_migrator && python -m app.json_importer"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migration:/app/import-data:ro
      - question_data:/app/legacy-data:ro
      - image_uploads:/app/uploads

  web:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 환경변수를 설정해야 합니다}
      DATABASE_URL: postgresql+psycopg://ml_exam_app:${POSTGRES_PASSWORD}@db:5432/ml_exam
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 환경변수를 설정해야 합니다}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      IMAGE_STORAGE_PATH: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - image_uploads:/app/uploads

volumes:
  postgres_data:
  question_data:
  image_uploads:
