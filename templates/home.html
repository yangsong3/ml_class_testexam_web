{% extends "base.html" %}
{% block content %}
<section class="hero">
  <p class="eyebrow">머신러닝 수업 중간고사 대비</p>
  <h1>집 가고 싶다</h1>
  <p>개념 · 피처 · NumPy · pandas · 데이터 시각화 문제를 풀고 즉시 해설을 확인하세요.</p>
  <a class="button primary" href="{{ url_for('quiz.show_quiz', category='all') }}">전체 문제 풀기</a>
</section>
<section>
  <div class="section-heading"><h2>분야별 학습</h2><span>분야별 3문제</span></div>
  <div class="category-grid">
  {% for item in categories %}
    <a class="category-card" href="{{ url_for('quiz.show_quiz', category=item.id) }}">
      <span class="count">{{ item.count }} 문제</span>
      <h3>{{ item.name }}</h3>
      <span class="arrow">→</span>
    </a>
  {% endfor %}
  </div>
</section>
{% endblock %}
