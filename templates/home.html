{% extends "base.html" %}
{% block content %}
<section class="hero">
  <p class="eyebrow">머신러닝/컴퓨터구조 중간고사 대비</p>
  <h1>집 가고 싶다</h1>
  <p>영어로 I want to go home</p>
  <a class="button primary" href="{{ url_for('quiz.show_quiz', category='all') }}">전체 문제 풀기</a>
</section>
<section>
  <div class="section-heading"><h2>분야별 학습</h2><span>분야별 n문제</span></div>
  <div class="category-grid">
  {% for item in categories %}
    {% if item.count > 0 %}
    <a class="category-card" href="{{ url_for('quiz.show_quiz', category=item.id) }}">
      <span class="count">{{ item.count }} 문제</span>
      <h3>{{ item.name }}</h3>
      <span class="arrow">→</span>
    </a>
    {% else %}
    <div class="category-card empty-category">
      <span class="count">준비 중</span>
      <h3>{{ item.name }}</h3>
    </div>
    {% endif %}
  {% endfor %}
  </div>
</section>
{% endblock %}
